name: Build Multi-Arch Hermes Image

on:
  workflow_dispatch:
    inputs:
      hermes_version:
        description: 'Upstream Hermes version/tag (e.g. v0.22.5 or latest)'
        required: true
        default: 'latest'
        type: string
      push:
        description: 'Push image to container registry'
        required: true
        default: true
        type: boolean
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

  workflow_call:
    inputs:
      hermes_version:
        description: 'Upstream Hermes version/tag'
        required: false
        default: 'latest'
        type: string
      push:
        description: 'Push image to container registry'
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'custom/**'
      - '.upstream-version'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Publish (amd64 / arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref || 'main' }}

      - name: Determine upstream version
        id: version
        run: |
          if [ -n "${{ inputs.hermes_version }}" ]; then
            HERMES_VER="${{ inputs.hermes_version }}"
          elif [ -f .upstream-version ] && [ -s .upstream-version ]; then
            HERMES_VER="$(tr -d '[:space:]' < .upstream-version)"
          else
            HERMES_VER="latest"
          fi

          # Strip leading 'v' if present for clean semver tag
          CLEAN_VER="${HERMES_VER#v}"

          echo "hermes_version=${HERMES_VER}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "HERMES_VERSION=${HERMES_VER}" >> "$GITHUB_ENV"
          echo "Target Hermes upstream version: ${HERMES_VER}"

      - name: Determine push behavior
        id: push_check
        run: |
          PUSH="true"
          if [ "${{ inputs.push }}" = "false" ]; then
            PUSH="false"
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "PUSH_IMAGE=${PUSH}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.hermes_version }}
            type=raw,value=${{ steps.version.outputs.clean_version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_VERSION=${{ steps.version.outputs.hermes_version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          echo "### 🚀 Multi-Architecture Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream Version:** \`${{ steps.version.outputs.hermes_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms Built:** \`${{ inputs.platforms || 'linux/amd64,linux/arm64' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed to Registry:** \`${{ env.PUSH_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`${{ steps.build_push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Generated Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Pull Example:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.hermes_version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
